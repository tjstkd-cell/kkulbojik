name: 꿀보직 공고 업데이트

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 오전 6시 (한국시간)
    - cron: "0 3 * * *"    # 매일 낮 12시 (한국시간)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fetch_jobs.py
      - name: 결과 저장
        run: |
          git config user.name "kkulbojik-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "공고 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
